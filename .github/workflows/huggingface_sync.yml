name: Sync to Hugging Face Spaces
on:
  push:
    branches: [ "main" ]

  # to run this manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # This pushes the entire repository to the huggingface space repository
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          
          # Create a clean deployment folder to avoid pushing git history and heavy binaries
          mkdir -p .hf_deploy
          cp sim/lightsim/Dockerfile .hf_deploy/
          cp -r sim firmware .hf_deploy/
          
          # Create Hugging Face Space configuration README
          cat << 'EOF' > .hf_deploy/README.md
          ---
          title: LightSim
          emoji: 🤖
          colorFrom: blue
          colorTo: red
          sdk: docker
          pinned: false
          app_port: 7860
          ---
          
          # LightSim
          Project Talos Web Simulator
          EOF
          
          cd .hf_deploy
          git init
          git remote add space https://${{ secrets.HF_USERNAME }}:${HF_TOKEN}@huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }}
          git add .
          git commit -m "Deploy from GitHub Actions"
          git push --force space HEAD:main
