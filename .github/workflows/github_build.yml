name: Build Firmware

on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]

jobs:
  build-motor-controller:
    name: Build ESP32 WROOM (Motor Control)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Build motor controller firmware
        shell: bash
        working-directory: ./firmware/esp
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      
      - name: Build size analysis
        shell: bash
        working-directory: ./firmware/esp
        run: |
          . $IDF_PATH/export.sh
          idf.py size
      
      - name: Upload motor controller artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-wroom-firmware-${{ github.sha }}
          path: |
            firmware/esp/build/*.bin
            firmware/esp/build/*.elf
          retention-days: 30

  build-vision-controller:
    name: Build ESP32-S3 (Vision)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.2
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      
      - name: Build vision controller firmware
        shell: bash
        working-directory: ./firmware/espcam
        run: |
          . $IDF_PATH/export.sh
          idf.py build
      
      - name: Build size analysis
        shell: bash
        working-directory: ./firmware/espcam
        run: |
          . $IDF_PATH/export.sh
          idf.py size
      
      - name: Upload vision controller artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware-${{ github.sha }}
          path: |
            firmware/espcam/build/*.bin
            firmware/espcam/build/*.elf
          retention-days: 30

  build-summary:
    name: Build Summary
    needs: [build-motor-controller, build-vision-controller]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check build status
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "ESP32 WROOM (Motor Control): ${{ needs.build-motor-controller.result }}" >> $GITHUB_STEP_SUMMARY
          echo "ESP32-S3 (Vision): ${{ needs.build-vision-controller.result }}" >> $GITHUB_STEP_SUMMARY